server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: studioflow-backend

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.mnuutpqvemaiwjnlvmcp.supabase.co:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

# StudioFlow Configuration
studioflow:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  conflict:
    minimum-travel-minutes: ${MINIMUM_TRAVEL_MINUTES:45} # Buffer time between locations in minutes
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  supabase:
    project-url: ${SUPABASE_PROJECT_URL:https://mnuutpqvemaiwjnlvmcp.supabase.co}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:sb_publishable_F9KDkj_b8UKllVjvs0_A0w_C35vtT1Q}
